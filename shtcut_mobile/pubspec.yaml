name: shtcut_mobile
description: A new Flutter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  connectivity_plus: ^6.0.5
  dio: ^5.8.0+1
  dotted_border: ^2.1.0
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  gap: ^3.0.1
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  shared_preferences: ^2.3.3
  permission_handler: ^10.4.5
  intl: ^0.19.0
  image_picker: ^1.1.2
  file_picker: ^9.1.0
  video_player: ^2.9.3
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  toastification: ^2.3.0

dev_dependencies:
  build_runner: ^2.4.5
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/svgs/
    - assets/fonts/
    
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/Satoshi-BlackItalic.otf
          weight: 900
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_128.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo_128.png"
  background_color_ios: "#000000"
